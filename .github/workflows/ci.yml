name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-reliability-tests:
    name: Linux reliability tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.15.1
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build extension and webview once
        run: npm run build
      - name: Check architecture contracts
        run: npm run check:contracts:plan
      - name: Run webview typecheck, core suites and browser workflows
        env:
          TMPDIR: /dev/shm/limcode-tests
          LIMCODE_TEST_EXECUTABLE_TMPDIR: ${{ runner.temp }}
        run: |
          mkdir -p "$TMPDIR"
          df -h "$TMPDIR"
          findmnt -no OPTIONS /dev/shm
          npm run test:ci
