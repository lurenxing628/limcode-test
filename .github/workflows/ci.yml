name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-reliability-tests:
    name: Linux reliability tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.15.1
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build, typecheck and validate contracts once
        run: |
          npm run build &
          limcode_build_pid=$!
          npm run typecheck:webview &
          limcode_typecheck_pid=$!
          npm run check:contracts:plan &
          limcode_contracts_pid=$!
          limcode_verification_status=0
          wait "$limcode_build_pid" || limcode_verification_status=$?
          wait "$limcode_typecheck_pid" || limcode_verification_status=$?
          wait "$limcode_contracts_pid" || limcode_verification_status=$?
          exit "$limcode_verification_status"
      - name: Run core suites and browser workflows
        run: npm run test:ci
